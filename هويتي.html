<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هوية الموظف الرقمية - شركة طريق البوادي</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --secondary: #3b82f6;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --text-light: #64748b;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            text-align: center;
            border: 1px solid #e2e8f0;
        }
        .header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            padding: 25px 20px;
        }
        .company-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 15px;
            color: #f1f5f9;
            background: rgba(255, 255, 255, 0.15);
            padding: 6px 12px;
            border-radius: 8px;
            display: inline-block;
        }
        .avatar {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: #e2e8f0;
            margin: 0 auto 10px;
            overflow: hidden;
            border: 4px solid rgba(255, 255, 255, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .body-content {
            padding: 25px;
        }
        .info-group {
            background: #f1f5f9;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            text-align: right;
            transition: all 0.3s ease;
        }
        .info-group:hover {
            background: #e2e8f0;
            transform: translateY(-2px);
        }
        .info-label {
            font-size: 12px;
            color: var(--text-light);
            margin-bottom: 3px;
        }
        .info-value {
            font-size: 16px;
            font-weight: 600;
            color: var(--text);
        }
        .status-box {
            margin-top: 15px;
            padding: 12px;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 12px;
        }
        .badge {
            display: inline-block;
            color: #166534;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 4px;
        }
        .activation-date {
            font-size: 11px;
            color: #15803d;
        }
        .footer {
            background: #f8fafc;
            padding: 15px;
            font-size: 12px;
            color: var(--text-light);
            border-top: 1px solid #e2e8f0;
        }
    </style>
</head>
